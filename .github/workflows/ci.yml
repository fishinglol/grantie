name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package tests
        run: npm test --workspaces --if-present
      - name: Typecheck the plugin package
        run: npm run typecheck -w @granite/plugins
      - name: Build the docs site
        run: npm run build -w @granite/docs
