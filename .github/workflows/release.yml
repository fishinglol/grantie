name: Release

on:
  push:
    tags:
      - "v*"
  # Editing this file runs both builds as a dry run (nothing is published), so a broken path shows up in the PR, not on the release.
  pull_request:
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

# The Android app is not built here: it comes from `eas build` (apps/mobile) and is attached to the release by hand
# as `Granite-Android.apk` (`gh release upload <tag> Granite-Android.apk`).
jobs:
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # macos-latest is an Apple-silicon machine; a plain build only runs on Apple silicon. Universal = one app for Intel and Apple-silicon Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      - name: Build the desktop app (unsigned, universal)
        working-directory: apps/desktop
        env:
          # Only on a tag build: a pull request's dry run gets no secrets. The values end up inside the app (Google says a desktop
          # app's client secret is not confidential), so this is about not printing them, not about hiding them.
          VITE_GOOGLE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/') && secrets.VITE_GOOGLE_CLIENT_SECRET || '' }}
        run: npm run tauri build -- --target universal-apple-darwin

      # v0.1.1 shipped without Google sign-in because these two values were not given to the build. Never again: a tag build
      # fails unless the client ID is really inside the built app.
      - name: Check Google sign-in is built in
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "the VITE_GOOGLE_CLIENT_ID secret is not set"; exit 1; }
          grep -rqF "$VITE_GOOGLE_CLIENT_ID" apps/desktop/dist || { echo "the client ID is not in the built app"; exit 1; }

      # Files on the release are named for the device, without a version, so `releases/latest/download/Granite-Mac.dmg` always works.
      - name: Name the installer
        working-directory: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg
        run: cp Granite_*_universal.dmg Granite-Mac.dmg

      - name: Attach build artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/Granite-Mac.dmg
          body_path: .github/release-notes.md

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build the desktop app (unsigned; the .exe installer only, the .msi is for company IT and only confuses)
        working-directory: apps/desktop
        env:
          # Only on a tag build: a pull request's dry run gets no secrets. The values end up inside the app (Google says a desktop
          # app's client secret is not confidential), so this is about not printing them, not about hiding them.
          VITE_GOOGLE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/') && secrets.VITE_GOOGLE_CLIENT_SECRET || '' }}
        run: npm run tauri build -- --bundles nsis

      # v0.1.1 shipped without Google sign-in because these two values were not given to the build. Never again: a tag build
      # fails unless the client ID is really inside the built app.
      - name: Check Google sign-in is built in
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "the VITE_GOOGLE_CLIENT_ID secret is not set"; exit 1; }
          grep -rqF "$VITE_GOOGLE_CLIENT_ID" apps/desktop/dist || { echo "the client ID is not in the built app"; exit 1; }

      - name: Name the installer
        working-directory: apps/desktop/src-tauri/target/release/bundle/nsis
        shell: bash
        run: cp Granite_*_x64-setup.exe Granite-Windows-Setup.exe

      - name: Attach build artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/Granite-Windows-Setup.exe
          body_path: .github/release-notes.md
