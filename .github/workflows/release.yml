name: Release

on:
  push:
    tags:
      - "v*"
  # Editing this file runs both builds as a dry run (nothing is published), so a broken path shows up in the PR, not on the release.
  pull_request:
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

# The Android app is not built here: it comes from `eas build` (apps/mobile) and is attached to the release by hand
# as `Granite-Android.apk` (`gh release upload <tag> Granite-Android.apk`).
jobs:
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # macos-latest is an Apple-silicon machine; a plain build only runs on Apple silicon. Universal = one app for Intel and Apple-silicon Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      # The in-app updater compares tauri.conf.json's version with latest.json, so a tag that disagrees with it would publish a release
      # no installed copy ever offers.
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != tauri.conf.json version $version"; exit 1; }

      - name: Build the desktop app (unsigned, universal)
        working-directory: apps/desktop
        env:
          # Only on a tag build: a pull request's dry run gets no secrets. The values end up inside the app (Google says a desktop
          # app's client secret is not confidential), so this is about not printing them, not about hiding them.
          VITE_GOOGLE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/') && secrets.VITE_GOOGLE_CLIENT_SECRET || '' }}
          # Signs the update files (the in-app updater refuses an unsigned update). Tag builds only: a pull request's dry run gets no secrets
          # and builds without update files instead (see the build step).
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          extra=()
          [[ "$GITHUB_REF" == refs/tags/* ]] || extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          npm run tauri build -- --target universal-apple-darwin "${extra[@]}"

      # v0.1.1 shipped without Google sign-in because these two values were not given to the build. Never again: a tag build
      # fails unless the client ID is really inside the built app.
      - name: Check Google sign-in is built in
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "the VITE_GOOGLE_CLIENT_ID secret is not set"; exit 1; }
          grep -rqF "$VITE_GOOGLE_CLIENT_ID" apps/desktop/dist || { echo "the client ID is not in the built app"; exit 1; }

      # Files on the release are named for the device, without a version, so `releases/latest/download/Granite-Mac.dmg` always works.
      - name: Name the installer
        working-directory: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg
        run: cp Granite_*_universal.dmg Granite-Mac.dmg

      # The files the in-app updater downloads (and their signatures), named like the installers.
      - name: Name the update files
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
        run: |
          cp Granite.app.tar.gz Granite-Mac.app.tar.gz
          cp Granite.app.tar.gz.sig Granite-Mac.app.tar.gz.sig

      - name: Attach build artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/Granite-Mac.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Granite-Mac.app.tar.gz
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Granite-Mac.app.tar.gz.sig
          body_path: .github/release-notes.md

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # The in-app updater compares tauri.conf.json's version with latest.json, so a tag that disagrees with it would publish a release
      # no installed copy ever offers.
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != tauri.conf.json version $version"; exit 1; }

      - name: Build the desktop app (unsigned; the .exe installer only, the .msi is for company IT and only confuses)
        working-directory: apps/desktop
        env:
          # Only on a tag build: a pull request's dry run gets no secrets. The values end up inside the app (Google says a desktop
          # app's client secret is not confidential), so this is about not printing them, not about hiding them.
          VITE_GOOGLE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.VITE_GOOGLE_CLIENT_ID || '' }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/') && secrets.VITE_GOOGLE_CLIENT_SECRET || '' }}
          # Signs the update files (the in-app updater refuses an unsigned update). Tag builds only: a pull request's dry run gets no secrets
          # and builds without update files instead (see the build step).
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          extra=()
          [[ "$GITHUB_REF" == refs/tags/* ]] || extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          npm run tauri build -- --bundles nsis "${extra[@]}"

      # v0.1.1 shipped without Google sign-in because these two values were not given to the build. Never again: a tag build
      # fails unless the client ID is really inside the built app.
      - name: Check Google sign-in is built in
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID" || { echo "the VITE_GOOGLE_CLIENT_ID secret is not set"; exit 1; }
          grep -rqF "$VITE_GOOGLE_CLIENT_ID" apps/desktop/dist || { echo "the client ID is not in the built app"; exit 1; }

      - name: Name the installer
        working-directory: apps/desktop/src-tauri/target/release/bundle/nsis
        shell: bash
        run: cp Granite_*_x64-setup.exe Granite-Windows-Setup.exe

      # The installer itself is the update file; this is its signature, named to match.
      - name: Name the update signature
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: apps/desktop/src-tauri/target/release/bundle/nsis
        shell: bash
        run: cp Granite_*_x64-setup.exe.sig Granite-Windows-Setup.exe.sig

      - name: Attach build artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/Granite-Windows-Setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/Granite-Windows-Setup.exe.sig
          body_path: .github/release-notes.md

  # The in-app updater reads one file, latest.json, from the newest release: the version plus, per platform, where to
  # download the update and its signature. Built here from the two .sig files the builds attached.
  update-manifest:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop-macos, desktop-windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Write and attach latest.json
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.sig'
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac "$(cat Granite-Mac.app.tar.gz.sig)" \
            --arg win "$(cat Granite-Windows-Setup.exe.sig)" \
            --arg base "$base" \
            '{version: $version, notes: "", pub_date: $date, platforms: {
               "darwin-aarch64": {signature: $mac, url: "\($base)/Granite-Mac.app.tar.gz"},
               "darwin-x86_64": {signature: $mac, url: "\($base)/Granite-Mac.app.tar.gz"},
               "windows-x86_64": {signature: $win, url: "\($base)/Granite-Windows-Setup.exe"}}}' > latest.json
          cat latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber
