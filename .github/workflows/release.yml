name: Release

on:
  push:
    tags:
      - "v*"
  # Editing this file runs both builds as a dry run (nothing is published), so a broken path shows up in the PR, not on the release.
  pull_request:
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # macos-latest is an Apple-silicon machine; a plain build only runs on Apple silicon. Universal = one app for Intel and Apple-silicon Macs.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: npm ci

      - name: Build the desktop app (unsigned, universal)
        working-directory: apps/desktop
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Zip the .app bundle
        working-directory: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
        run: ditto -c -k --sequesterRsrc --keepParent Granite.app Granite-macOS.zip

      - name: Attach build artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Granite-macOS.zip
          body: |
            Unsigned macOS build for Intel and Apple-silicon Macs. On first launch, macOS Gatekeeper will say the app
            is from an unidentified developer: right-click the app, choose **Open**,
            then confirm **Open** in the dialog. You only need to do this once.

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build the desktop app (unsigned)
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Attach build artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          body: |
            Unsigned Windows build. On first launch, Windows SmartScreen will say it
            protected your PC: click **More info**, then **Run anyway**. You only need to do this once.
