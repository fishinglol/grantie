# Cloudflare Worker for Live Collab's relay (see README, "Run the relay on Cloudflare").
name = "granite-live"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "LiveRoom"

# Durable Objects on Cloudflare's free plan must use SQLite storage (this relay stores nothing, it only needs the object).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

# At most 30 new connections a minute from one address (a reconnecting person makes ~6). Needs wrangler 4.36 or later.
[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
